name: Record demos

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/demos.yml
      - docs/demos/**
      - tests/**
      - ftdetect/**
      - README.md
      - README.zh-CN.md
      - lua/**
      - queries/**

permissions:
  contents: read

concurrency:
  group: demos-${{ github.ref }}
  cancel-in-progress: false

jobs:
  record:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      XDG_CONFIG_HOME: ${{ github.workspace }}/.demo-deps/config
      XDG_DATA_HOME: ${{ github.workspace }}/.demo-deps/data
      XDG_STATE_HOME: ${{ github.workspace }}/.demo-deps/state
      XDG_CACHE_HOME: ${{ github.workspace }}/.demo-deps/cache
      VIMOI_DEMO_TREESITTER: ${{ github.workspace }}/.demo-deps/nvim-treesitter
      VIMOI_DEMO_TOKYONIGHT: ${{ github.workspace }}/.demo-deps/tokyonight.nvim
      VIMOI_DEMO_SCREENKEY: ${{ github.workspace }}/.demo-deps/screenkey.nvim
      VIMOI_DEMO_BLINK: ${{ github.workspace }}/.demo-deps/blink.cmp
      VIMOI_DEMO_LINT: ${{ github.workspace }}/.demo-deps/nvim-lint
      NVIM_LOG_FILE: ${{ github.workspace }}/.demo-deps/nvim.log
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: nvim-treesitter/nvim-treesitter
          ref: 41416e81a6c7f4af4984395bfe0cd8d174e70976
          path: .demo-deps/nvim-treesitter
      - uses: actions/checkout@v4
        with:
          repository: folke/tokyonight.nvim
          ref: cdc07ac78467a233fd62c493de29a17e0cf2b2b6
          path: .demo-deps/tokyonight.nvim
      - uses: actions/checkout@v4
        with:
          repository: NStefan002/screenkey.nvim
          ref: 740e238d1f143cb5f3a9d932f9c5142d3581b986
          path: .demo-deps/screenkey.nvim
      - uses: actions/checkout@v4
        with:
          repository: Saghen/blink.cmp
          ref: 78336bc89ee5365633bcf754d93df01678b5c08f
          path: .demo-deps/blink.cmp
      - uses: actions/checkout@v4
        with:
          repository: mfussenegger/nvim-lint
          ref: 3d55c8f67c6ae5c15e1042571e107c7a3d5c5f4e
          path: .demo-deps/nvim-lint
      - uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: v0.12.6
      - uses: charmbracelet/vhs-action@v2
        with:
          version: v0.12.1
      - name: Install and check Nerd Font
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$XDG_DATA_HOME/fonts" "$RUNNER_TEMP/demo-fonts"
          gh release download v3.4.0 --repo ryanoasis/nerd-fonts \
            --pattern JetBrainsMono.zip --dir "$RUNNER_TEMP/demo-fonts"
          unzip -j "$RUNNER_TEMP/demo-fonts/JetBrainsMono.zip" \
            JetBrainsMonoNerdFontMono-Regular.ttf JetBrainsMonoNerdFontMono-Bold.ttf \
            JetBrainsMonoNerdFontMono-Italic.ttf JetBrainsMonoNerdFontMono-BoldItalic.ttf \
            -d "$XDG_DATA_HOME/fonts"
          fc-cache -f
          fc-match -f 'Family: %{family}\nStyle: %{style}\nFile: %{file}\n' 'JetBrainsMono Nerd Font Mono'
          test "$(fc-match -f '%{family}' 'JetBrainsMono Nerd Font Mono' | cut -d, -f1)" = 'JetBrainsMono Nerd Font Mono'
      - name: Install Lua checker
        run: sudo apt-get update && sudo apt-get install -y lua5.4
      - name: Install chezmoi and Tree-sitter CLI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/demo-bin" "$RUNNER_TEMP/demo-downloads"
          gh release download v2.73.3 --repo twpayne/chezmoi \
            --pattern 'chezmoi_*_linux_amd64.tar.gz' --dir "$RUNNER_TEMP/demo-downloads"
          tar -xzf "$RUNNER_TEMP"/demo-downloads/chezmoi_*.tar.gz \
            -C "$RUNNER_TEMP/demo-bin" chezmoi
          gh release download v0.26.9 --repo tree-sitter/tree-sitter \
            --pattern tree-sitter-linux-x64.gz --dir "$RUNNER_TEMP/demo-downloads"
          gzip -dc "$RUNNER_TEMP/demo-downloads/tree-sitter-linux-x64.gz" > "$RUNNER_TEMP/demo-bin/tree-sitter"
          chmod +x "$RUNNER_TEMP/demo-bin/chezmoi" "$RUNNER_TEMP/demo-bin/tree-sitter"
          echo "$RUNNER_TEMP/demo-bin" >> "$GITHUB_PATH"
      - name: Install and check test parsers
        run: nvim --headless -n -i NONE -u NONE -l docs/demos/install-parsers.lua
      - name: Test and record
        run: python3 tests/run.py
      - uses: actions/upload-artifact@v4
        with:
          name: demos
          path: |
            docs/demos/output/*.gif
            docs/demos/output/*.png
            docs/demos/output/*.mp4
            docs/demos/output/*.json
            docs/demos/output/index.html
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: record
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: demos
          path: demos
      - name: Replace demo release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > "$RUNNER_TEMP/demo-notes.md" <<EOF
          Automatically recorded demos for commit $GITHUB_SHA.

          Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID

          These assets are replaced on each successful recording. This is not a plugin release.
          EOF
          if ! gh release view demos --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create demos --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title 'Demo recordings' --prerelease --latest=false \
              --notes-file "$RUNNER_TEMP/demo-notes.md"
          fi
          gh release upload demos demos/*.gif demos/*.png demos/*.mp4 --clobber --repo "$GITHUB_REPOSITORY"
          gh release edit demos --repo "$GITHUB_REPOSITORY" --notes-file "$RUNNER_TEMP/demo-notes.md"

      - name: Check published README media
        run: |
          for media in demos/*.gif demos/*.mp4; do
            curl --fail --silent --show-error --location --head --retry 3 \
              "https://github.com/$GITHUB_REPOSITORY/releases/download/demos/${media##*/}" >/dev/null
          done
